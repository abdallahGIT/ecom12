<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>دخول لوحة الإدارة | Ecom12</title>
  <style>
    :root { color-scheme: light; font-family: Tahoma, Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: linear-gradient(135deg, #f7f0e5, #efe3d1); color: #35241c; }
    .card { width: min(420px, 100%); background: #fffdf9; border: 1px solid #ead9c2; border-radius: 22px; padding: 34px; box-shadow: 0 18px 50px rgba(83, 54, 30, .14); text-align: center; }
    .mark { width: 64px; height: 64px; margin: 0 auto 16px; display: grid; place-items: center; border-radius: 18px; background: #5b3528; color: #fff; font-size: 30px; }
    h1 { margin: 0 0 8px; font-size: 25px; }
    p { margin: 0 0 24px; color: #806d60; }
    label { display: block; text-align: right; margin-bottom: 8px; font-weight: 700; }
    input { width: 100%; border: 1px solid #d9c6ad; border-radius: 12px; padding: 14px; font-size: 18px; text-align: center; letter-spacing: 3px; outline: none; }
    input:focus { border-color: #8f5c43; box-shadow: 0 0 0 3px rgba(143, 92, 67, .14); }
    button { width: 100%; margin-top: 16px; border: 0; border-radius: 12px; padding: 14px; background: #5b3528; color: #fff; font-size: 17px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    #error { min-height: 24px; margin-top: 14px; color: #b42318; font-size: 14px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">🔒</div>
    <h1>لوحة إدارة Ecom12</h1>
    <p>أدخل كلمة المرور للمتابعة</p>
    <form id="loginForm">
      <label for="password">كلمة المرور</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button id="submitButton" type="submit">دخول لوحة الإدارة</button>
      <div id="error" role="alert"></div>
    </form>
  </main>
  <script>
    const form = document.getElementById('loginForm');
    const password = document.getElementById('password');
    const button = document.getElementById('submitButton');
    const error = document.getElementById('error');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      error.textContent = '';
      button.disabled = true;
      try {
        const response = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: password.value })
        });
        const data = await response.json();
        if (!response.ok || !data.success) throw new Error(data.error || 'تعذر تسجيل الدخول');
        window.location.href = '/admin';
      } catch (err) {
        error.textContent = err.message;
        password.select();
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
